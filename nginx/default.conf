# HTTP → HTTPS にリダイレクト
server {
    listen 80;
    server_name vindies.jp;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name vindies.jp;

    ssl_certificate /etc/letsencrypt/live/vindies.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vindies.jp/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri /index.html;
    }
}